<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>שעון עולמי מתקדם</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 30px 20px;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 25px;
            font-size: 2.5rem;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        /* סרגל שליטה - הוספה ושינוי תצוגה */
        .controls-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
            background: #1e293b;
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        select, button {
            font-family: inherit;
            font-size: 1rem;
            border-radius: 8px;
            outline: none;
        }

        select {
            background-color: #0f172a;
            color: #fff;
            border: 1px solid #475569;
            padding: 10px 15px;
            cursor: pointer;
        }

        .btn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background-color: #7dd3fc;
            transform: scale(1.03);
        }

        .btn-view {
            background-color: #334155;
            color: #ffffff;
            border: 1px solid #475569;
        }

        .btn-view:hover {
            background-color: #475569;
        }

        .btn-view.active {
            background-color: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
        }

        /* תצוגת רשת (Grid) */
        .clocks-container {
            width: 100%;
            max-width: 1000px;
            transition: all 0.3s ease;
        }

        .clocks-container.grid-view {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        /* תצוגת רשימה (List) */
        .clocks-container.list-view {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .clock-card {
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            border: 1px solid #334155;
            position: relative;
            transition: transform 0.2s, border-color 0.2s;
        }

        .clock-card:hover {
            border-color: #38bdf8;
        }

        .list-view .clock-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 25px;
        }

        .city-name {
            font-size: 1.3rem;
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .list-view .city-name {
            margin-bottom: 0;
            min-width: 180px;
        }

        .time {
            font-size: 2rem;
            font-weight: bold;
            color: #4ade80;
            font-family: 'Courier New', Courier, monospace;
            background: #0f172a;
            padding: 8px 12px;
            border-radius: 8px;
            letter-spacing: 2px;
            display: inline-block;
        }

        .list-view .time {
            font-size: 1.6rem;
            padding: 5px 15px;
        }

        .date {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 8px;
        }

        .list-view .date {
            margin-top: 0;
            min-width: 120px;
            text-align: center;
        }

        /* כפתור מחיקה */
        .delete-btn {
            position: absolute;
            top: 12px;
            left: 12px;
            background: #ef4444;
            color: white;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
            transition: opacity 0.2s, transform 0.2s;
        }

        .delete-btn:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        .list-view .delete-btn {
            position: static;
            margin-right: 15px;
        }

        .empty-msg {
            text-align: center;
            color: #64748b;
            font-size: 1.2rem;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <h1>🌍 שעון עולמי מתקדם</h1>

    <!-- סרגל כלים -->
    <div class="controls-bar">
        <select id="citySelect">
            <option value="" disabled selected>בחר עיר להוספה...</option>
            <option value="Asia/Jerusalem|🇮🇱 ירושלים">🇮🇱 ירושלים</option>
            <option value="Europe/London|🇬🇧 לונדון">🇬🇧 לונדון</option>
            <option value="America/New_York|🇺🇸 ניו יורק">🇺🇸 ניו יורק</option>
            <option value="Asia/Tokyo|🇯🇵 טוקיו">🇯🇵 טוקיו</option>
            <option value="Europe/Paris|🇫🇷 פריז">🇫🇷 פריז</option>
            <option value="America/Los_Angeles|🇺🇸 לוס אנג'לס">🇺🇸 לוס אנג'לס</option>
            <option value="Australia/Sydney|🇦🇺 סידני">🇦🇺 סידני</option>
            <option value="Asia/Dubai|🇦🇪 דובאי">🇦🇪 דובאי</option>
            <option value="Asia/Bangkok|🇹🇭 בנגקוק">🇹🇭 בנגקוק</option>
            <option value="America/Buenos_Aires|🇦🇷 בואנוס איירס">🇦🇷 בואנוס איירס</option>
        </select>
        
        <button class="btn" onclick="addCity()">+ הוסף עיר</button>

        <div style="border-right: 1px solid #475569; margin: 0 5px;"></div>

        <button class="btn btn-view active" id="btnGrid" onclick="setView('grid')">תצוגת כרטיסים 🔳</button>
        <button class="btn btn-view" id="btnList" onclick="setView('list')">תצוגת רשימה ☰</button>
    </div>

    <!-- מכל השעונים -->
    <div class="clocks-container grid-view" id="clocksContainer"></div>

    <script>
        // רשימת ערים ברירת מחדל
        let activeCities = [
            { id: '1', name: '🇮🇱 ירושלים', timeZone: 'Asia/Jerusalem' },
            { id: '2', name: '🇬🇧 לונדון', timeZone: 'Europe/London' },
            { id: '3', name: '🇺🇸 ניו יורק', timeZone: 'America/New_York' },
            { id: '4', name: '🇯🇵 טוקיו', timeZone: 'Asia/Tokyo' }
        ];

        let currentView = 'grid';

        // הוספת עיר חדשה
        function addCity() {
            const select = document.getElementById('citySelect');
            const value = select.value;
            if (!value) return;

            const [timeZone, name] = value.split('|');

            // בדיקה אם העיר כבר קיימת ברשימה
            if (activeCities.some(c => c.timeZone === timeZone)) {
                alert('העיר הזו כבר מופיעה על המסך!');
                return;
            }

            activeCities.push({
                id: Date.now().toString(),
                name: name,
                timeZone: timeZone
            });

            renderClocks();
            updateTimes();
        }

        // מחיקת עיר
        function removeCity(id) {
            activeCities = activeCities.filter(c => c.id !== id);
            renderClocks();
            updateTimes();
        }

        // שינוי תצוגה (רשת / רשימה)
        function setView(viewMode) {
            currentView = viewMode;
            const container = document.getElementById('clocksContainer');
            const btnGrid = document.getElementById('btnGrid');
            const btnList = document.getElementById('btnList');

            if (viewMode === 'grid') {
                container.className = 'clocks-container grid-view';
                btnGrid.classList.add('active');
                btnList.classList.remove('active');
            } else {
                container.className = 'clocks-container list-view';
                btnList.classList.add('active');
                btnGrid.classList.remove('active');
            }
        }

        // בנאי הכרטיסים על המסך
        function renderClocks() {
            const container = document.getElementById('clocksContainer');
            
            if (activeCities.length === 0) {
                container.innerHTML = '<div class="empty-msg">אין ערים מוצגות. בחר עיר מהרשימה ולחץ "הוסף עיר".</div>';
                return;
            }

            container.innerHTML = activeCities.map(city => `
                <div class="clock-card" id="card-${city.id}">
                    <button class="delete-btn" onclick="removeCity('${city.id}')" title="מחק עיר">✕</button>
                    <div class="city-name">${city.name}</div>
                    <div class="time" id="time-${city.id}">00:00:00</div>
                    <div class="date" id="date-${city.id}">--/--/----</div>
                </div>
            `).join('');
        }

        // עדכון הזמנים
        function updateTimes() {
            const now = new Date();

            activeCities.forEach(city => {
                const timeElem = document.getElementById(`time-${city.id}`);
                const dateElem = document.getElementById(`date-${city.id}`);

                if (timeElem && dateElem) {
                    const timeFormatter = new Intl.DateTimeFormat('he-IL', {
                        timeZone: city.timeZone,
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit',
                        hour12: false
                    });

                    const dateFormatter = new Intl.DateTimeFormat('he-IL', {
                        timeZone: city.timeZone,
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric'
                    });

                    timeElem.textContent = timeFormatter.format(now);
                    dateElem.textContent = dateFormatter.format(now);
                }
            });
        }

        // אתחול ראשוני
        renderClocks();
        updateTimes();
        setInterval(updateTimes, 1000);
    </script>

</body>
</html>
